# The "operational" source database for the project.
# Plays the role of an energy retailer's production OLTP database.
#
# Start:   docker compose up -d
# Stop:    docker compose down          (keeps data)
# Reset:   docker compose down -v       (deletes the volume; init scripts run again on next start)

services:
  mysql:
    image: mysql:8.4
    container_name: energy-retail-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      # Used by mysql/init/02_airbyte_user.sh
      AIRBYTE_DB_USER: ${AIRBYTE_DB_USER}
      AIRBYTE_DB_PASSWORD: ${AIRBYTE_DB_PASSWORD}
    # Server settings for Change Data Capture (CDC).
    # CDC tools like Airbyte don't query tables for changes; they read the binary
    # log (binlog), the server's ordered journal of every change. MySQL 8.x already
    # logs row-based by default, so these flags mostly make the requirements explicit.
    # (Passed as flags rather than a mounted .cnf file because MySQL ignores
    # config files that look world-writable, which Windows bind mounts do.)
    command:
      - --server-id=1                          # a CDC reader connects like a replica; the source needs an id
      - --log-bin=mysql-bin                    # binlog on
      - --binlog-row-image=FULL                # log whole rows, not only changed columns
      - --binlog-expire-logs-seconds=604800    # keep 7 days; sync less often than that and CDC must start over
    ports:
      # Host port 3307, not 3306, so it doesn't clash with a MySQL server you may
      # already have installed locally (e.g. from the bootcamp).
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs once, on first start with an empty volume, in alphabetical order
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
